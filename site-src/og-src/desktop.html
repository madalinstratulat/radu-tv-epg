<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:200 800;src:url(/fonts/manrope-latin.woff2)}
@font-face{font-family:Manrope;font-weight:200 800;src:url(/fonts/manrope-latin-ext.woff2);unicode-range:U+0100-02AF,U+0218-021B}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#121410;color:#f1e6d4;font-family:Manrope,sans-serif}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6}
.g1{width:520px;height:520px;left:-120px;top:-160px;background:#5f6f4a}.g2{width:460px;height:460px;right:-80px;top:-120px;background:#8a6a33}.g3{width:420px;height:420px;left:520px;bottom:-260px;background:#3e5a52}
.l{position:absolute;left:72px;top:86px;width:520px}
.brand{display:flex;align-items:center;font-weight:800;font-size:28px}.brand img{width:62px;height:62px;border-radius:14px;margin-right:16px}
.pill{display:inline-block;margin-top:34px;font-weight:700;font-size:22px;color:#c9d4b4;background:rgba(169,181,151,.12);border:1px solid rgba(169,181,151,.3);padding:8px 18px;border-radius:999px}
h1{font-size:64px;line-height:1.05;letter-spacing:-1.5px;margin:22px 0 0;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(100deg,#c9d4b4,#e9c98c 70%);-webkit-background-clip:text;color:transparent}
.url{position:absolute;left:72px;bottom:58px;font-weight:700;font-size:24px;color:#a9b597}
.scr{position:absolute;left:640px;top:120px;width:620px;border-radius:16px;padding:9px;background:linear-gradient(160deg,#2b2e27,#141612);box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.07) inset;transform:perspective(1400px) rotateY(-12deg)}
.scr img{display:block;width:100%;border-radius:9px}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="l"><div class="brand"><img src="/img/radutv.png">Radu TV</div>
<div class="pill" id="pill"></div>
<h1>Televiziunea de acasă, <em id="em"></em></h1></div>
<div class="url" id="url"></div>
<div class="scr"><img src="/img/app.jpg"></div>
<script>
var mac = location.hash === '#mac';
document.getElementById('pill').textContent = mac ? 'Nou · pentru Mac' : 'Nou · pentru Windows 10 și 11';
document.getElementById('em').textContent = mac ? 'pe Mac.' : 'pe calculator.';
document.getElementById('url').textContent = mac ? 'radu-tv.pages.dev/mac' : 'radu-tv.pages.dev/windows';
</script></body></html>
