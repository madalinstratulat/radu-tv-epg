name: channels
on:
  schedule:
    - cron: '30 3 * * *'     # daily 03:30 UTC, after the guide job
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq librsvg2-bin >/dev/null && pip -q install pillow
      - name: Excluded channels that have a working stream again come back
        run: python3 -I channels/recheck-excluded.py --restore || true
      - run: node channels/build.js --refresh
      - name: Logos for new channels
        run: python3 -I channels/fetch-logos.py || true
      - name: Drop channels whose streams are gone (conservative from a datacenter)
        run: python3 -I channels/check-streams.py --conservative --write-exclude || true
      - run: node channels/build.js
      - run: |
          git config user.name "epg-bot"; git config user.email "epg-bot@users.noreply.github.com"
          git add channels.json channels.config.json logos; git commit -m "channels $(date -u +%F)" || echo "no change"; git pull --rebase origin main && git push
