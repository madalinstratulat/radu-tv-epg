name: epg
on:
  schedule:
    # GitHub often starts scheduled runs hours late or skips them: three tries a night, extra runs just find no change
    - cron: '15 0 * * *'
    - cron: '15 2 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 epg.py
      - run: |
          git config user.name "epg-bot"; git config user.email "epg-bot@users.noreply.github.com"
          git add epg.json; git commit -m "epg $(date -u +%F)" || echo "no change"; git pull --rebase origin main && git push
